<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Opening ACE Dialer</title>
<style>
  /* Same tokens as panel.html (CLAUDE.md §27). */
  :root {
    color-scheme: dark;
    --bg: #000; --bg-elevated: #1c1c1e; --text: #fff; --text-dim: rgba(235, 235, 245, 0.7);
    --accent: #0a84ff; --press: rgba(255, 255, 255, 0.08);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f2f2f7; --bg-elevated: #fff; --text: #1c1c1e; --text-dim: rgba(60, 60, 67, 0.7);
      --accent: #007aff; --press: rgba(0, 0, 0, 0.05);
    }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { max-width: 420px; margin: 24px 16px; padding: 28px 24px; border-radius: 16px; background: var(--bg-elevated); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { color: var(--text-dim); margin: 0 0 10px; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  button {
    min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 600; background: var(--press); color: var(--text);
  }
  button.primary { background: var(--accent); color: #fff; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="card">
  <h1 id="status">Opening ACE Dialer…</h1>
  <p>If Chrome asks, choose <strong>Open ACE Dialer</strong>. Tick “Always allow” to skip the question next time.</p>
  <p>Nothing happened? Make sure the ACE Dialer desktop app is installed.</p>
  <div class="actions">
    <button class="primary" id="again">Open again</button>
    <button id="close">Close</button>
  </div>
</div>

<script src="launch.js"></script>
