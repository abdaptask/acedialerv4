<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ACE Dialer</title>
<style>
  /* Light: white cards on soft grey with blue accents. Dark: the dialer's iOS
     dark tokens (CLAUDE.md §27). Green stays the call colour in both, as in
     the dialer. The panel follows the computer's light/dark setting. */
  :root {
    color-scheme: light;
    --bg: #f3f4f6; --head: #fff; --card: #fff; --card-ring: #e3e6ea; --line: #e3e6ea; --line-soft: #edf0f3;
    --text: #1d2226; --text-dim: #5e6670; --text-muted: #6b7280;
    --accent: #0a66c2; --accent-soft: #e8f1fb; --green: #057642; --red: #cb112d; --orange: #b25000;
    --hover: #eef3f8; --press: #eef0f3;
    --av-bg: #dce8f5; --av-fg: #0a66c2;
    --bar: #fff; --key: #eef0f3; --key-press: #dde2e8;
    --call-bg: #057642; --call-fg: #fff; --pill-call-fg: #fff; --text-bg: #fff; --text-ring: #0a66c2; --ring: #c4c9cf;
    --toast-bg: #1d2226; --toast-fg: #fff; --toast-act: #70b5f9;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #000; --head: #000; --card: #1c1c1e; --card-ring: transparent; --line: rgba(84, 84, 88, 0.6); --line-soft: rgba(84, 84, 88, 0.6);
      --text: #fff; --text-dim: rgba(235, 235, 245, 0.7); --text-muted: rgba(235, 235, 245, 0.6);
      --accent: #0a84ff; --accent-soft: rgba(10, 132, 255, 0.16); --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
      --hover: rgba(255, 255, 255, 0.06); --press: rgba(255, 255, 255, 0.08);
      --av-bg: #3a3a3c; --av-fg: #fff;
      --bar: rgba(22, 22, 24, 0.94); --key: #333336; --key-press: #737373;
      --call-bg: rgba(255, 255, 255, 0.08); --call-fg: #30d158; --pill-call-fg: #000; --text-bg: rgba(255, 255, 255, 0.08); --text-ring: transparent; --ring: rgba(84, 84, 88, 0.9);
      --toast-bg: #3a3a3c; --toast-fg: #fff; --toast-act: #0a84ff;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Layout. Narrow and medium: list over a bottom tab bar. Wide (the side
     panel dragged out, 640px+): a tab rail, the list, and a detail pane. */
  .app {
    height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "col" "tabs";
  }
  .col { grid-area: col; display: flex; flex-direction: column; min-height: 0; }
  .pane { grid-area: detail; display: none; }

  header {
    flex: none; display: flex; align-items: center; gap: 2px;
    padding: 10px 4px 8px 16px; background: var(--head); border-bottom: 1px solid var(--line);
  }
  header .titles { flex: 1; min-width: 0; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .sub { color: var(--text-dim); font-size: 12.5px; font-variant-numeric: tabular-nums; min-height: 18px; }
  .icon-btn {
    width: 44px; height: 44px; display: grid; place-items: center; flex: none;
    border: 0; border-radius: 22px; background: transparent; color: var(--text-dim); cursor: pointer;
    transition: background-color 90ms cubic-bezier(0.2, 0, 0, 1);
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn.spin svg { animation: spin 700ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .icon-btn.spin svg { animation: none; } }

  main { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
  .view[hidden] { display: none !important; }

  /* Lists */
  .group { background: var(--card); border: 1px solid var(--card-ring); border-radius: 10px; }
  .group + .group { margin-top: 8px; }
  .gh {
    display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 44px;
    padding: 0 12px; border: 0; border-bottom: 1px solid var(--line-soft); background: none; cursor: pointer;
    color: var(--text-dim); font: 600 12px/1 var(--sans); letter-spacing: 0.02em; text-transform: uppercase; text-align: left;
    border-radius: 10px 10px 0 0;
  }
  .gh svg { transition: transform 120ms cubic-bezier(0.2, 0, 0, 1); }
  .gh[aria-expanded="false"] { border-bottom: 0; border-radius: 10px; }
  .gh[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .row { position: relative; display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 4px; min-height: 56px; }
  .row + .row { border-top: 1px solid var(--line-soft); }
  .row:first-child { border-radius: 10px 10px 0 0; }
  .row:last-child { border-radius: 0 0 10px 10px; }
  .row:only-child { border-radius: 10px; }
  .gh + .row { border-radius: 0; }
  .gh + .row:last-child { border-radius: 0 0 10px 10px; }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--accent-soft); }
  .open {
    flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 2px 0 2px 8px;
    border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; text-align: left; cursor: default;
  }
  .av {
    width: 32px; height: 32px; border-radius: 16px; flex: none; display: grid; place-items: center;
    background: var(--av-bg); color: var(--av-fg); font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
  }
  .who { display: block; flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line { color: var(--text-dim); font-size: 12.5px; font-variant-numeric: tabular-nums; display: flex; gap: 4px; align-items: center; min-width: 0; }
  .line span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line.warn { color: var(--red); }
  .line svg { flex: none; }
  .num { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { color: var(--text-dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); flex: none; margin-right: -4px; }
  .acts { display: flex; gap: 6px; flex: none; }
  .act {
    width: 44px; height: 44px; display: grid; place-items: center; flex: none; padding: 0;
    border: 0; border-radius: 22px; cursor: pointer; background: var(--press); color: var(--accent);
    transition: background-color 90ms cubic-bezier(0.2, 0, 0, 1);
  }
  .act.call { background: var(--call-bg); color: var(--call-fg); }
  .act.text { background: var(--text-bg); color: var(--accent); box-shadow: inset 0 0 0 1px var(--text-ring); }
  .act.done, .act.more { background: transparent; color: var(--text-dim); }
  .act.done:hover, .act.more:hover { background: var(--press); color: var(--text); }
  .act.more { display: none; }
  .act:hover { filter: brightness(1.08); }
  .menu {
    position: absolute; right: 6px; top: calc(100% - 6px); z-index: 5; min-width: 170px; padding: 4px; display: grid;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  }
  .menu button {
    min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 0; border-radius: 8px;
    background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer;
  }
  .menu button:hover { background: var(--hover); }
  .menu button svg { color: var(--text-dim); }

  /* Compact rows (narrow, and the wide list beside its detail pane): the time
     until you point at a row, then its actions. Text and Done move into "…". */
  @media (max-width: 379px), (min-width: 640px) {
    .row .acts { display: none; }
    .row:hover .acts, .row:focus-within .acts, .row.menu-open .acts { display: flex; }
    .row:hover .time, .row:focus-within .time, .row.menu-open .time { display: none; }
    .acts .secondary { display: none; }
    .act.more { display: grid; }
  }

  .search {
    width: 100%; min-height: 40px; margin: 0 0 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); font: inherit;
  }
  .search::placeholder { color: var(--text-muted); }

  .state { text-align: center; padding: 56px 24px 24px; color: var(--text-dim); }
  .state strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
  .primary {
    margin-top: 18px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 22px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
  }
  .primary:disabled { opacity: 0.6; cursor: default; }
  .err { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .foot { padding: 14px 4px 4px; color: var(--text-muted); font-size: 12px; text-align: center; }
  .foot button { border: 0; background: none; color: var(--accent); font: inherit; cursor: pointer; padding: 4px; }

  /* Detail pane (wide only) */
  .dcard { background: var(--card); border: 1px solid var(--card-ring); border-radius: 10px; padding: 20px; display: grid; gap: 18px; }
  .dhead { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .av.big { width: 56px; height: 56px; border-radius: 28px; font-size: 20px; }
  .dname { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
  .dnum { font-size: 14px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .dbtns { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    min-height: 44px; padding: 0 20px; border: 0; border-radius: 22px; display: inline-flex; align-items: center; gap: 8px;
    font: 600 14px/1 var(--sans); cursor: pointer;
  }
  .pill.call { background: var(--green); color: var(--pill-call-fg); }
  .pill.text { background: var(--card); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pill.done { background: var(--card); color: var(--text-dim); box-shadow: inset 0 0 0 1px var(--ring); }
  .pill:hover { filter: brightness(1.06); }
  .hcard { margin-top: 12px; }
  .hhead { padding: 12px 14px 10px; color: var(--text-dim); font: 600 12px/1 var(--sans); letter-spacing: 0.02em; text-transform: uppercase; border-bottom: 1px solid var(--line-soft); }
  .ev { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 50px; }
  .ev + .ev { border-top: 1px solid var(--line-soft); }
  .evdot { width: 8px; height: 8px; border-radius: 4px; flex: none; background: var(--text-muted); }
  .evdot.call { background: var(--green); }
  .evdot.text { background: var(--accent); }
  .evdot.red { background: var(--red); }
  .ev .what { font-size: 14px; }
  .ev .how { font-size: 12.5px; color: var(--text-dim); }
  .ev .time { padding-right: 0; margin-left: auto; }
  .hnote { padding: 16px 14px; color: var(--text-dim); font-size: 13px; }

  /* Keypad */
  .keypad { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 8px; }
  .entry {
    width: 100%; border: 0; background: transparent; color: var(--text); text-align: center;
    font: 300 30px/1.2 var(--mono); letter-spacing: 0.02em; min-height: 44px; padding: 0 8px;
  }
  .entry::placeholder { color: var(--text-muted); font: 400 15px/1.2 var(--sans); letter-spacing: 0; }
  .entry:focus-visible { outline: none; }
  .pretty { color: var(--text-dim); font-size: 13px; min-height: 18px; font-variant-numeric: tabular-nums; }
  /* Line type, as on the dialer's Dialpad (PhoneTypeBadge.css): quiet text, no
     colour per type; the one accent is the carrier-verified check. */
  .ptype { display: inline-flex; align-items: center; gap: 5px; min-height: 18px; font-size: 13px; color: var(--text-muted); letter-spacing: 0.01em; }
  .keypad .ptype { margin-top: -10px; }
  .ptype.verified { color: var(--text-dim); }
  .ptype.verified svg { color: var(--accent); flex: none; }
  .ptype.invalid { color: var(--orange); }
  .ptype .checking { animation: ptype-pulse 1.2s ease-out infinite alternate; }
  @keyframes ptype-pulse { from { opacity: 1; } to { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .ptype .checking { animation: none; } }
  .keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px 22px; }
  .key {
    width: 72px; height: 72px; border-radius: 36px; border: 0; cursor: pointer;
    background: var(--key); color: var(--text); display: grid; place-content: center; text-align: center;
    transition: background-color 90ms cubic-bezier(0.2, 0, 0, 1);
    -webkit-user-select: none; user-select: none;
  }
  .key:active { background: var(--key-press); }
  .key b { font: 400 30px/1 var(--mono); }
  .key small { font-size: 9px; letter-spacing: 0.18em; color: var(--text-dim); min-height: 11px; margin-top: 2px; font-weight: 600; }
  .dial-row { display: grid; grid-template-columns: repeat(3, 72px); gap: 22px; align-items: center; justify-items: center; }
  .round { width: 72px; height: 72px; border-radius: 36px; border: 0; cursor: pointer; display: grid; place-items: center; }
  .round.call { background: var(--green); color: #fff; }
  .round:disabled { opacity: 0.4; cursor: default; }
  .ghost { width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; color: var(--text-dim); cursor: pointer; display: grid; place-items: center; }
  .ghost:hover { background: var(--hover); color: var(--text); }
  .ghost[hidden] { display: grid !important; visibility: hidden; }
  .hint { color: var(--text-muted); font-size: 12px; text-align: center; max-width: 260px; }

  /* Tabs */
  nav {
    grid-area: tabs; display: grid; grid-template-columns: repeat(5, 1fr);
    border-top: 1px solid var(--line); background: var(--bar);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  nav button {
    position: relative; min-height: 52px; border: 0; background: none; cursor: pointer; color: var(--text-dim);
    display: grid; justify-items: center; align-content: center; gap: 2px; font: 600 10px/1.1 var(--sans); padding: 6px 0 4px;
  }
  nav button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
  nav .count {
    position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
    background: var(--red); color: #fff; font: 600 11px/17px var(--sans); font-variant-numeric: tabular-nums;
  }

  .toast {
    position: fixed; left: 12px; right: 12px; bottom: 64px; z-index: 10; display: flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 6px 0 14px; border-radius: 10px; background: var(--toast-bg); color: var(--toast-fg);
    font-size: 13px; box-shadow: var(--shadow);
  }
  .toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { min-height: 44px; padding: 0 10px; border: 0; background: none; color: var(--toast-act); font: 600 13px/1 var(--sans); cursor: pointer; }

  /* Narrow: tab labels go, icons stay (each keeps its name for screen readers). */
  @media (max-width: 379px) {
    nav .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    nav button { min-height: 48px; }
    nav .count { top: 5px; left: calc(50% + 4px); }
  }

  @media (min-width: 640px) {
    .app {
      grid-template-columns: 76px minmax(300px, 360px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
      grid-template-areas: "tabs col detail";
    }
    .app[data-view="keypad"] { grid-template-columns: 76px minmax(0, 1fr); grid-template-areas: "tabs col"; }
    .col { border-right: 1px solid var(--line); }
    .app[data-view="keypad"] .col { border-right: 0; }
    .pane { display: block; overflow-y: auto; padding: 16px; }
    .app[data-view="keypad"] .pane { display: none; }
    nav { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; border-top: 0; border-right: 1px solid var(--line); }
    nav button { width: 64px; min-height: 56px; border-radius: 10px; }
    nav button[aria-selected="true"] { box-shadow: none; background: var(--accent-soft); }
    nav .count { left: calc(50% + 4px); }
    .open { cursor: pointer; }
    .toast { left: 88px; right: auto; width: min(360px, calc(100% - 100px)); bottom: 16px; }
  }
</style>

<div class="app" id="app" data-view="keypad">
<div class="col">
<header>
  <div class="titles">
    <h1 id="title">Keypad</h1>
    <div class="sub" id="sub"></div>
  </div>
  <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
  </button>
  <button class="icon-btn" id="settings" title="Click-to-call settings" aria-label="Click-to-call settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</header>

<main>
  <!-- Keypad: works signed out — it only prefills the dialer, it needs no data. -->
  <section class="view keypad" id="view-keypad" role="tabpanel" aria-labelledby="tab-keypad">
    <input class="entry" id="entry" type="tel" inputmode="tel" autocomplete="off" spellcheck="false"
           placeholder="Type or paste a number" aria-label="Phone number" />
    <div class="pretty" id="pretty"></div>
    <div class="ptype" id="ptype" role="status"></div>
    <div class="keys" id="keys"></div>
    <div class="dial-row">
      <button class="ghost" id="kp-text" title="Text this number" aria-label="Text this number">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="round call" id="kp-call" title="Call" aria-label="Call" disabled>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button class="ghost" id="kp-back" title="Delete" aria-label="Delete last digit" hidden>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg>
      </button>
    </div>
    <div class="hint">Call and Text open the number in ACE Dialer, ready for you to press Call or Send.</div>
  </section>

  <section class="view" id="view-recents" role="tabpanel" aria-labelledby="tab-recents" hidden></section>
  <section class="view" id="view-messages" role="tabpanel" aria-labelledby="tab-messages" hidden></section>
  <section class="view" id="view-contacts" role="tabpanel" aria-labelledby="tab-contacts" hidden>
    <input class="search" id="contact-q" type="search" placeholder="Search name or number" aria-label="Search favorites" autocomplete="off" />
    <div id="contacts-list"></div>
  </section>
